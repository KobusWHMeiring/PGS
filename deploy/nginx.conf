# nginx site for organicguarantee.africa — served from the shared homtini VPS.
#
# Installed by deploy/first-install.sh AFTER `certbot certonly --nginx` has
# succeeded, and re-synced by deploy/deploy.sh on every deploy. certbot owns the
# certificate paths below; do not hand-edit them on the box, because the next
# deploy copies this file over the top.
#
# Do NOT add `include proxy_params;` — it sets `Host` as well, so nginx sends Host
# twice, WSGI joins the values to "host,host", and Django rejects the request with
# a 400 that names neither header nor proxy. The explicit headers below are the
# complete set.

server {
    listen 80;
    listen [::]:80;
    server_name organicguarantee.africa www.organicguarantee.africa;

    # Renewal fallback. `certbot renew` with the nginx authenticator inserts its
    # own location too; this one keeps a webroot-style renewal working as well,
    # which is the case when someone runs `certbot renew --webroot`.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name organicguarantee.africa www.organicguarantee.africa;

    ssl_certificate     /etc/letsencrypt/live/organicguarantee.africa/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/organicguarantee.africa/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # The chatbot posts a question and streams an answer; 10 MB is far more than
    # that, and small enough that an upload cannot be used to exhaust the box.
    client_max_body_size 10M;

    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header X-Content-Type-Options "nosniff" always;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_types text/plain text/css text/xml application/json application/javascript
               application/rss+xml application/atom+xml image/svg+xml;

    # Django's STATIC_ROOT is staticfiles/, never static/ — serving `static/` here
    # yields 404s for every hashed asset while the files sit one directory away.
    location /static/ {
        alias /home/carbonplanner/apps/pgs/staticfiles/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri $uri/ =404;
    }

    # Public derivatives only: the site logo and the published documents that
    # /documents/<code>/ streams. PRIVATE_MEDIA_ROOT (evidence photos, voice notes)
    # is deliberately absent from this file — adding it publishes the group's
    # certification evidence to anyone who guesses a path.
    location /media/ {
        alias /home/carbonplanner/apps/pgs/media/;
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
        try_files $uri $uri/ =404;
    }

    # A deploy's health check hits this through the socket, but exposing it over
    # TLS is what lets an external uptime monitor see the same readiness signal
    # (503 when the database, Redis or a Celery worker is down).
    location = /health/ {
        proxy_pass http://unix:/home/carbonplanner/apps/pgs/pgs.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
    }

    location / {
        proxy_pass http://unix:/home/carbonplanner/apps/pgs/pgs.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
    }
}
