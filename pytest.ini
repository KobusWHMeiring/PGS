[pytest]
# MVP0_PLAN_V2.md §2 does not list this file, but `pytest -q` (HANDOVER §7) and
# A8's CI step cannot run without it: pytest-django needs to be told which
# settings module to configure Django with.
#
# It is `pgs.settings_test`, NOT `pgs.settings`: the test settings swap in a fast password
# hasher (see pgs/settings_test.py). Every `create_user(password=…)` and `client.login()`
# otherwise pays ~0.5s of PBKDF2 at production iterations — 12–15s of a ~60s warm suite.
# `manage.py`, WSGI and `scripts/verify.sh` keep loading `pgs.settings`, and
# `tests/tools/test_test_harness.py` fails if that ever changes.
DJANGO_SETTINGS_MODULE = pgs.settings_test

# `pythonpath` makes the repo root importable so `import pgs.settings` works even
# when pytest is invoked from a subdirectory. Without it, discovery depends on
# walking the __init__.py chain, which is fragile.
pythonpath = .
python_files = test_*.py

# `tests/e2e` is deliberately absent: it needs a browser and a live server, and the
# gate (`scripts/verify.sh`) must stay runnable on a machine with neither. Run it
# explicitly: `python -m pytest tests/e2e -q`.
#
# `tests/tools` holds the developer-tooling tests (the UAT runner and write-back). It is
# in testpaths because a test outside testpaths is a test nobody runs — and the UAT
# tooling decides what a reviewer signs, so its guarantees belong in the gate.
testpaths = core knowledge tests/tools

markers =
    e2e: browser-driven check (needs `playwright install chromium`)
    slow: measured >~0.5s, or spawns a process, or drives a browser — deselected by scripts/fast.sh

# Show the reason a test failed before the assertion diff, and keep output short
# enough that a CI log stays readable.
addopts = -ra --strict-markers
